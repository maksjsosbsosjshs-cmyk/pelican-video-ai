
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Video AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b14;color:white;
 font-family:Arial,sans-serif;padding:25px;
}
main{max-width:650px;margin:45px auto}
h1{font-size:35px;color:#a78bfa}
p{color:#aaa}
textarea{
 width:100%;height:140px;padding:16px;
 background:#171a27;color:white;
 border:1px solid #444;border-radius:12px;
 font-size:16px;
}
button{
 width:100%;padding:16px;margin-top:15px;
 background:#8055e9;color:white;
 border:0;border-radius:12px;
 font-size:17px;font-weight:bold;
}
video{width:100%;margin-top:20px;border-radius:12px}
#status{margin-top:18px;color:#b9a3ff}
</style>
</head>
<body>
<main>
<h1>Pelican Video AI</h1>
<p>Transforme suas ideias em vídeos com inteligência artificial.</p>

<textarea id="prompt" maxlength="1500"
placeholder="Descreva o vídeo que você quer criar..."></textarea>

<button id="generate">Criar meu vídeo</button>

<div id="status"></div>
<div id="result"></div>
</main>

<script>
const button=document.getElementById("generate");

button.addEventListener("click",async()=>{
 const prompt=document.getElementById("prompt").value.trim();
 const status=document.getElementById("status");
 const result=document.getElementById("result");

 if(!prompt){
  status.textContent="Descreva seu vídeo primeiro.";
  return;
 }

 button.disabled=true;
 status.textContent="Enviando solicitação...";
 result.innerHTML="";

 try{
  const response=await fetch("/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt})
  });

  const data=await response.json();

  if(!response.ok) throw new Error(data.error);

  const video=document.createElement("video");
  video.src=data.video;
  video.controls=true;
  video.playsInline=true;
  result.appendChild(video);

  status.textContent="Vídeo recebido!";
 }catch(error){
  status.textContent="Erro: "+error.message;
 }finally{
  button.disabled=false;
 }
});
</script>
</body>
</html>
